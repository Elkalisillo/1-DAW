<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Multiplicar por 2</title>
    <style>
        body { font-family: Arial; background-color: #f0f4f8; max-width: 600px; margin: auto; padding: 20px; }
        h1 { color: #2c5282; }
    </style>
    <script>
        let numero = prompt("Escribe un número");
        let resultado = numero * 2;
        alert(numero + " x 2 = " + resultado);
    </script>
</head>
<body>
    <h1>Multiplicar por 2</h1>
</body>
</html>
