<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Multiplicar números</title>
    <style>
        body { font-family: Arial; background-color: #f0f4f8; max-width: 600px; margin: auto; padding: 20px; }
        h1 { color: #2c5282; }
    </style>
    <script>
        let num1 = prompt("Escribe el primer número");
        let num2 = prompt("Escribe el segundo número");
        let resultado = num1 * num2;
        alert(num1 + " x " + num2 + " = " + resultado);
    </script>
</head>
<body>
    <h1>Multiplicar números</h1>
</body>
</html>
