<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Leer de caja de texto</title>
    <style>
        body { font-family: Arial; background-color: #f0f4f8; max-width: 600px; margin: auto; padding: 20px; }
        h1 { color: #2c5282; }
        button { background-color: #2c5282; color: white; border: none; padding: 6px 12px; border-radius: 4px; }
    </style>
    <script>
        function saludar() {
            let nombre = document.getElementById("nombre").value;
            let apellido = document.getElementById("apellido").value;
            alert("Hola " + nombre + " " + apellido);
        }
    </script>
</head>
<body>
    <h1>Leer de caja de texto</h1>
    <p>Nombre: <input type="text" id="nombre"></p>
    <p>Apellido: <input type="text" id="apellido"></p>
    <button onclick="saludar()">Saludar</button>
</body>
</html>
