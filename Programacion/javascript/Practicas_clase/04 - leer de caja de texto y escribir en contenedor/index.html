<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Leer de caja de texto y escribir en contenedor</title>
    <style>
        body { font-family: Arial; background-color: #f0f4f8; max-width: 600px; margin: auto; padding: 20px; }
        h1 { color: #2c5282; }
        button { background-color: #2c5282; color: white; border: none; padding: 6px 12px; border-radius: 4px; }
        #saludo { color: green; font-weight: bold; font-size: 20px; }
    </style>
    <script>
        function saludar() {
            let nombre = document.getElementById("nombre").value;
            document.getElementById("saludo").innerHTML = "Hola " + nombre;
        }
    </script>
</head>
<body>
    <h1>Saludo</h1>
    <p>Nombre: <input type="text" id="nombre"> <button onclick="saludar()">Saludar</button></p>
    <div id="saludo"></div>
</body>
</html>
