<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mostrar imagen</title>
    <style>
        body { font-family: Arial; background-color: #f0f4f8; max-width: 600px; margin: auto; padding: 20px; }
        h1 { color: #2c7f82; }
        button { background-color: #2c7f82; color: white; border: none; padding: 6px 12px; border-radius: 4px; }
        img { width: 250px; }
    </style>
    <script>
        function mostrar() {
            let imagen = document.getElementById("imagen").value;
            imagen = imagen + ".jpg";
            document.getElementById("contenedor").innerHTML = "<img src='imagenes/" + imagen + "'>";
        }
    </script>
</head>
<body>
    <h1>Mostrar imagen</h1>
    <p>Imágenes disponibles: rectangulo, triangulo, rombo, cuadrado</p>
    <p>Nombre: <input type="text" id="imagen"> <button onclick="mostrar()">Mostrar</button></p>
    <div id="contenedor"></div>
</body>
</html>
