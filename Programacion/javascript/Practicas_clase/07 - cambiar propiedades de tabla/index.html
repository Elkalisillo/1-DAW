<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cambiar propiedades de tabla</title>
    <style>
        body { font-family: Arial; background-color: #f0f4f8; max-width: 700px; margin: auto; padding: 20px; }
        h1 { color: #2c7f82; }
        button { background-color: #2c7f82; color: white; border: none; padding: 6px 12px; border-radius: 4px; }
    </style>
    <script>
        function cambiarAncho() {
            let ancho = document.getElementById("ancho").value;
            document.getElementById("tabla").width = ancho;
        }

        function cambiarColor() {
            let color = document.getElementById("color").value;
            document.getElementById("tabla").bgColor = color;
        }

        function cambiarBorde() {
            let borde = document.getElementById("borde").value;
            document.getElementById("tabla").border = borde;
        }
    </script>
</head>
<body>
    <h1>Cambiar propiedades de tabla</h1>

    <table id="tabla" border="1">
        <tr><th>Nombre</th><th>Ciudad</th><th>Edad</th></tr>
        <tr><td>Ana</td><td>Madrid</td><td>19</td></tr>
        <tr><td>Luis</td><td>Sevilla</td><td>22</td></tr>
        <tr><td>Marta</td><td>Valencia</td><td>20</td></tr>
    </table>

    <p>Ancho: <input type="text" id="ancho"> <button onclick="cambiarAncho()">Aplicar ancho</button></p>
    <p>Color de fondo: <input type="text" id="color"> <button onclick="cambiarColor()">Aplicar color</button></p>
    <p>Grosor del borde: <input type="text" id="borde"> <button onclick="cambiarBorde()">Aplicar borde</button></p>
</body>
</html>
