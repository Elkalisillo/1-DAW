<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Decide con if</title>
    <style>
        body { font-family: Arial; background-color: #f0f4f8; max-width: 600px; margin: auto; padding: 20px; }
        h1 { color: #2c7f82; }
        button { background-color: #2c7f82; color: white; border: none; padding: 6px 12px; border-radius: 4px; }
        #resultado { font-weight: bold; font-size: 20px; }
    </style>
    <script>
        function comprobar() {
            let edad = parseInt(document.getElementById("edad").value);
            if (18 - edad <= 3) {
                document.getElementById("resultado").innerHTML = "Eres apto";
                document.getElementById("resultado").style.color = "green";
            } else {
                document.getElementById("resultado").innerHTML = "No eres apto";
                document.getElementById("resultado").style.color = "red";
            }
        }
    </script>
</head>
<body>
    <h1>¿Eres apto?</h1>
    <p>Edad: <input type="text" id="edad"> <button onclick="comprobar()">Comprobar</button></p>
    <div id="resultado"></div>
    <p><a href="version2.html">Ir a la versión 2</a></p>
</body>
</html>
