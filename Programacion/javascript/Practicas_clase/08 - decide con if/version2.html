<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Decide con if - Versión 2</title>
    <style>
        body { font-family: Arial; background-color: #f0f4f8; max-width: 600px; margin: auto; padding: 20px; }
        h1 { color: #2c5282; }
        button { background-color: #2c5282; color: white; border: none; padding: 6px 12px; border-radius: 4px; }
        #resultado { font-weight: bold; font-size: 20px; }
    </style>
    <script>
        function comprobar() {
            let edad = parseInt(document.getElementById("edad").value);
            let diferencia = parseInt(document.getElementById("diferencia").value);
            if (18 - edad <= diferencia) {
                document.getElementById("resultado").innerHTML = "Eres apto";
                document.getElementById("resultado").style.color = "green";
            } else {
                document.getElementById("resultado").innerHTML = "No eres apto";
                document.getElementById("resultado").style.color = "red";
            }
        }
    </script>
</head>
<body>
    <h1>¿Eres apto? (versión 2)</h1>
    <p>Diferencia de edad: <input type="text" id="diferencia"></p>
    <p>Edad: <input type="text" id="edad"></p>
    <button onclick="comprobar()">Comprobar</button>
    <div id="resultado"></div>
    <p><a href="index.html">Volver a la versión 1</a></p>
</body>
</html>
