    <div class="contenedor-movible" id="miContenedor">
        <div class="barra-arrastre" id="miBarra">¡Arrástrame desde aquí!</div>
        <div class="contenido">
            <p>Puedes mover todo este contenedor haciendo clic y arrastrando la barra azul superior.</p>
        </div>
    </div>

    <script>
        const contenedor = document.getElementById('miContenedor');
        const barra = document.getElementById('miBarra');

        let enMovimiento = false;
        let Xinicial, Yinicial;
        let desplazamientoX = 0, desplazamientoY = 0;

        // Detectar cuando el usuario presiona el elemento (ratón o táctil)
        barra.addEventListener('pointerdown', (e) => {
            enMovimiento = true;

            Xinicial = e.clientX - desplazamientoX;
            Yinicial = e.clientY - desplazamientoY;

            barra.setPointerCapture(e.pointerId);
        });

        barra.addEventListener('pointermove', (e) => {
            if (!enMovimiento) return;

            desplazamientoX = e.clientX - Xinicial;
            desplazamientoY = e.clientY - Yinicial;

            contenedor.style.transform = `translate(${desplazamientoX}px, ${desplazamientoY}px)`;
        });

        barra.addEventListener('pointerup', (e) => {
            enMovimiento = false;
            barra.releasePointerCapture(e.pointerId);
        });
    </script>
